<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Card Version 1</title>
    <style>
        body {
            background-color: #e8f5e9;
            /* light green */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        .user-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .user-card img {
            border-radius: 0%;
            /* square image */
            width: 100px;
            height: 100px;
        }
        
        button {
            background-color: #2ecc71;
            /* green button */
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="user-card">
        <img src="https://via.placeholder.com/100" alt="User Image" />
