<!DOCTYPE html>
<html>

<head>
    <title>Student Form</title>
    <style>
        #studentFormContainer {
            display: none;
            /* Hidden by default */
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            width: 300px;
        }
        
        .card {
            border: 1px solid #333;
            padding: 10px;
            margin: 10px 0;
            width: 250px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <!-- Open Form Button -->
    <button id="openFormBtn">Student</button>

    <!-- Student Form (Hidden by default) -->
    <div id="studentFormContainer">
        <h2>Student Form</h2>
        <form id="studentForm">
            <!-- Name -->
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <!-- Age -->
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" required><br><br>

            <!-- Class -->
            <label for="class">Class:</label><br>
            <input type="text" id="class" name="class" required><br><br>

            <!-- Email -->
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <!-- Address -->
            <label for="address">Address:</label><br>
            <input type="text" id="address" name="address" required><br><br>

            <!-- Photo Upload -->
            <label for="photo">Upload Photo:</label><br>
            <input type="file" id="photo" name="photo" accept="image/*" required><br><br>

            <!-- Submit Button -->
            <button type="submit">Submit</button>

            <!-- Back Button -->
            <button type="button" id="backBtn">Back</button>
        </form>
    </div>

    <!-- Display Cards -->
    <div id="cardContainer"></div>

    <script>
        // Open Form
        document.getElementById("openFormBtn").addEventListener("click", function() {
            document.getElementById("studentFormContainer").style.display = "block";
            this.style.display = "none"; // Hide the Student button
        });

        // Back Button
        document.getElementById("backBtn").addEventListener("click", function() {
            document.getElementById("studentFormContainer").style.display = "none";
            document.getElementById("openFormBtn").style.display = "inline-block"; // Show Student button again
        });

        // Form Submit
        document.getElementById("studentForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Stop page reload

            // Get values
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let className = document.getElementById("class").value;
            let email = document.getElementById("email").value;
            let address = document.getElementById("address").value;
            let photo = document.getElementById("photo").files[0];

            // Create File Reader for image
            let reader = new FileReader();
            reader.onload = function(e) {
                let imageURL = e.target.result;

                // Create Card
                let card = document.createElement("div");
                card.classList.add("card");
                card.innerHTML = `
          <img src="${imageURL}" alt="Student Photo">
          <h3>${name}</h3>
          <p><b>Age:</b> ${age}</p>
          <p><b>Class:</b> ${className}</p>
          <p><b>Email:</b> ${email}</p>
          <p><b>Address:</b> ${address}</p>
        `;

                document.getElementById("cardContainer").appendChild(card);
            };
            reader.readAsDataURL(photo);

            // Clear form
            document.getElementById("studentForm").reset();

            // Hide form and show button again
            document.getElementById("studentFormContainer").style.display = "none";
            document.getElementById("openFormBtn").style.display = "inline-block";
        });
    </script>
</body>

</html>
