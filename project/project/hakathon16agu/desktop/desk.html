<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop UI</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="desk.css">
</head>

<body>

    <!-- Sidebar Dock -->

    <div class="dock">

        <!-- Calculator -->
        <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" alt="Calculator">

        <!-- Digital Clock -->
        <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" alt="Digital Clock">

        <!-- Notepad -->
        <img src="https://cdn-icons-png.flaticon.com/512/3159/3159310.png" alt="Notepad">
    </div>









    <!-- Window Header -->
    <div class="title-bar">
        <!-- Search Bar -->
        <div class="search-container">
            <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" alt="Search">
            <input type="text" placeholder="Search Google or type a URL">
            <img src="https://cdn-icons-png.flaticon.com/512/709/709631.png" alt="Mic">
        </div>

        <!-- Window Buttons -->
        <div class="btns">
            <span class="btn">–</span>
            <span class="btn">□</span>
            <span class="btn">×</span>
        </div>
    </div>

    <!-- External JS -->
    <script src="desk.js"></script>
</body>

</html>
