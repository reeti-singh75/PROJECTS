<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop UI</title>
    <style>
        body {
            margin: 0;
            background: #222;
            font-family: Arial, sans-serif;
        }
        /* Sidebar / Dock */
        
        .dock {
            position: fixed;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
        }
        
        .dock img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .dock img:hover {
            transform: scale(1.2);
        }
        /* Window Header */
        
        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8dff0;
            padding: 5px 10px;
            height: 50px;
            border-bottom: 2px solid #ddd;
        }
        
        .btns {
            display: flex;
            gap: 15px;
        }
        
        .btn {
            font-size: 18px;
            cursor: pointer;
            color: #555;
        }
        
        .btn:hover {
            color: black;
        }
        /* Search Bar */
        
        .search-container {
            flex: 1;
            margin: 0 20px;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 25px;
            padding: 5px 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .search-container input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 16px;
            padding: 5px;
        }
        
        .search-container img {
            width: 20px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Sidebar Dock -->
    <div class="dock">
        <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" alt="Folder">
        <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png" alt="Music">
        <img src="https://cdn-icons-png.flaticon.com/512/888/888034.png" alt="Document">
    </div>

    <!-- Window Header -->
    <div class="title-bar">
        <!-- Search Bar -->
        <div class="search-container">
            <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" alt="Search">
            <input type="text" placeholder="Search Google or type a URL">
            <img src="https://cdn-icons-png.flaticon.com/512/709/709631.png" alt="Mic">
        </div>

        <!-- Window Buttons -->
        <div class="btns">
            <span class="btn">–</span>
            <span class="btn">□</span>
            <span class="btn">×</span>
        </div>
    </div>

</body>

</html>
