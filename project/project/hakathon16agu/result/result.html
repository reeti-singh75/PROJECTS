<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop UI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            height: 100vh;
            overflow: hidden;
        }
        
        .dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        
        .dock img {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .dock img:hover {
            transform: scale(1.2);
        }
        
        .window {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: #2c2c3c;
            border-radius: 10px;
            box-shadow: 0px 0px 10px black;
            padding: 20px;
            display: none;
            z-index: 900;
        }
        
        .window h2 {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .close-btn {
            float: right;
            cursor: pointer;
            color: #ff4c4c;
            font-weight: bold;
        }
        
        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
            resize: none;
        }
        
        button {
            margin-top: 10px;
            padding: 8px 15px;
            background: #00bfff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            color: white;
        }
        
        button:hover {
            background: #0099cc;
        }
        
        .calculator {
            background: #2c2c3c;
            border-radius: 15px;
            padding: 20px;
        }
        
        #display {
            width: 100%;
            height: 50px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
        }
        
        .buttons button {
            height: 50px;
            font-size: 18px;
        }
        
        .equal {
            grid-column: span 2;
            background: #ff5722;
        }
        
        .equal:hover {
            background: #e64a19;
        }
        
        .clock {
            text-align: center;
            font-size: 30px;
        }
        
        .time {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="dock">

        <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" alt="Calculator" id="openCalc">
        <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" alt="Digital Clock" id="openClock">
        <img src="https://cdn-icons-png.flaticon.com/512/3159/3159310.png" alt="Notepad" id="openNotepad">
    </div>


    <div class="window" id="notepadWindow">
        <span class="close-btn" onclick="closeWindow('notepadWindow')">✖</span>
        <h2>📝 My Notepad</h2>
        <textarea id="noteArea" placeholder="Type your notes here..."></textarea>
        <br>
        <button onclick="saveNote()">💾 Save Note</button>
    </div>

    <div class="window" id="calcWindow">
        <span class="close-btn" onclick="closeWindow('calcWindow')">✖</span>
        <h2>🧮 Calculator</h2>
        <div class="calculator">
            <input type="text" id="display" disabled>
            <div class="buttons">
                <button onclick="clearDisplay()">C</button>
                <button onclick="deleteLast()">⌫</button>
                <button onclick="append('%')">%</button>
                <button onclick="append('/')">÷</button>
                <button onclick="append('7')">7</button>
                <button onclick="append('8')">8</button>
                <button onclick="append('9')">9</button>
                <button onclick="append('*')">×</button>
                <button onclick="append('4')">4</button>
                <button onclick="append('5')">5</button>
                <button onclick="append('6')">6</button>
                <button onclick="append('-')">−</button>
                <button onclick="append('1')">1</button>
                <button onclick="append('2')">2</button>
                <button onclick="append('3')">3</button>
                <button onclick="append('+')">+</button>
                <button onclick="append('0')">0</button>
                <button onclick="append('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <div class="window" id="clockWindow">
        <span class="close-btn" onclick="closeWindow('clockWindow')">✖</span>
        <h2>⏰ Digital Clock</h2>
        <div class="clock">
            <div class="time" id="time">00:00:00</div>
            <div class="date" id="date">Loading...</div>
        </div>
    </div>

    <script>
        function openWindow(id) {
            document.getElementById(id).style.display = "block";
        }


        function closeWindow(id) {
            document.getElementById(id).style.display = "none";
        }

        document.getElementById("openNotepad").onclick = function() {
            openWindow("notepadWindow");
        }

        function saveNote() {
            let note = document.getElementById("noteArea").value;
            localStorage.setItem("myNote", note);
            alert("Note Saved! ");
        }

        window.onload = function() {
            let savedNote = localStorage.getItem("myNote");
            if (savedNote) {
                document.getElementById("noteArea").value = savedNote;
            }
        }


        document.getElementById("openCalc").onclick = function() {
            openWindow("calcWindow");
        }

        let display = document.getElementById("display");

        function append(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch {
                alert("Invalid Expression");
            }
        }

        document.getElementById("openClock").onclick = function() {
            openWindow("clockWindow");
        }

        function updateClock() {
            let now = new Date();
            let time = now.toLocaleTimeString();
            let date = now.toDateString();
            document.getElementById("time").innerText = time;
            document.getElementById("date").innerText = date;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>

</html>
