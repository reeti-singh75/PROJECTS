<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            width: 500px;
            background: #2c2c3c;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px black;
            text-align: center;
        }
        
        h2 {
            margin-bottom: 15px;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
            resize: none;
        }
        
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #00bfff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }
        
        button:hover {
            background: #0099cc;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>📝 My Notepad</h2>
        <textarea id="noteArea" placeholder="Type your notes here..."></textarea>
        <br>
        <button onclick="saveNote()">💾 Save Note</button>
    </div>

    <script>
        // Save note in localStorage
        function saveNote() {
            let note = document.getElementById("noteArea").value;
            localStorage.setItem("myNote", note);
            alert("Note Saved! ✅");
        }

        // Load note when page opens
        window.onload = function() {
            let savedNote = localStorage.getItem("myNote");
            if (savedNote) {
                document.getElementById("noteArea").value = savedNote;
            }
        }
    </script>
</body>

</html>
